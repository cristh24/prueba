<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Certificados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Generador de Certificados</h1>
        <form id="search-form">
            <label for="dni-input">Ingrese su DNI o Código de Estudiante:</label>
            <input type="text" id="dni-input" placeholder="DNI o Código" required>
            <button type="submit">Buscar y Descargar</button>
        </form>

        <!-- Modal para mostrar el resultado -->
        <div id="result-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <p id="student-name"></p>
                <a id="download-link" href="#" target="_blank">Descargar Certificado</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
